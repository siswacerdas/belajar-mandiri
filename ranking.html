<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Papan Peringkat · Belajar Mandiri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --primary:   #059669;
      --primary-lt:#d1fae5;
      --primary-pl:#f0fdf4;
      --gold:      #d97706;
      --silver:    #64748b;
      --bronze:    #92400e;
      --success:   #16a34a;
      --danger:    #dc2626;
      --text:      #1e293b;
      --text-lt:   #64748b;
      --border:    #e2e8f0;
      --bg:        #f0fdf4;
      --card-bg:   #ffffff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ─────────────────────────────────────────────────── */
    .header {
      background: var(--primary);
      color: #fff;
      padding: 0 20px;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 10px rgba(0,0,0,.18);
      position: sticky; top: 0; z-index: 50;
    }
    .header-left { display: flex; flex-direction: column; }
    .header-title { font-family: 'Lora', serif; font-size: 1.05rem; font-weight: 700; font-style: italic; }
    .header-sub   { font-size: .72rem; opacity: .8; margin-top: 1px; }
    .btn-back {
      background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
      color: #fff; border-radius: 8px; padding: 6px 14px;
      font-family: 'Nunito', sans-serif; font-size: .85rem; font-weight: 700;
      cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 6px;
      transition: background .2s;
    }
    .btn-back:hover { background: rgba(255,255,255,.25); }

    /* ── MAIN ────────────────────────────────────────────────────── */
    .main { max-width: 860px; margin: 0 auto; padding: 28px 16px 60px; }

    .page-title {
      font-family: 'Lora', serif; font-size: 1.6rem; font-weight: 700; color: var(--primary);
      margin-bottom: 4px;
    }
    .page-sub { color: var(--text-lt); font-size: .9rem; margin-bottom: 24px; }

    /* ── FILTER ──────────────────────────────────────────────────── */
    .filter-bar {
      display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px;
      align-items: center;
    }
    .filter-label { font-weight: 700; font-size: .85rem; color: var(--text-lt); }
    .filter-select {
      padding: 8px 14px; border: 1.5px solid var(--border); border-radius: 10px;
      font-family: 'Nunito', sans-serif; font-size: .9rem; color: var(--text);
      background: #fff; cursor: pointer;
      transition: border-color .2s;
    }
    .filter-select:focus { outline: none; border-color: var(--primary); }
    .btn-refresh {
      padding: 8px 16px; border-radius: 10px; border: 1.5px solid var(--primary);
      background: var(--primary); color: #fff; font-family: 'Nunito', sans-serif;
      font-size: .85rem; font-weight: 700; cursor: pointer; transition: opacity .2s;
    }
    .btn-refresh:hover { opacity: .85; }
    .btn-refresh:disabled { opacity: .5; cursor: default; }

    /* ── STAT CARDS ──────────────────────────────────────────────── */
    .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .stat-card {
      background: var(--card-bg); border-radius: 14px;
      padding: 16px 18px; border-top: 4px solid var(--primary);
      box-shadow: 0 2px 8px rgba(5,150,105,.08);
    }
    .stat-num  { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
    .stat-lbl  { font-size: .78rem; color: var(--text-lt); margin-top: 2px; }

    /* ── LOADING / EMPTY ─────────────────────────────────────────── */
    .loading-box, .empty-box {
      background: var(--card-bg); border-radius: 14px; padding: 40px;
      text-align: center; color: var(--text-lt);
      box-shadow: 0 2px 8px rgba(5,150,105,.06);
    }
    .loading-spinner {
      width: 36px; height: 36px; border: 4px solid var(--primary-lt);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin .8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── PODIUM (top 3) ──────────────────────────────────────────── */
    .podium {
      display: flex; justify-content: center; align-items: flex-end;
      gap: 12px; margin-bottom: 28px; padding: 0 8px;
    }
    .podium-item {
      display: flex; flex-direction: column; align-items: center;
      flex: 1; max-width: 200px;
    }
    .podium-avatar {
      width: 54px; height: 54px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; font-weight: 800; color: #fff;
      margin-bottom: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }
    .podium-avatar.rank-1 { background: linear-gradient(135deg,#f59e0b,#d97706); width: 64px; height: 64px; font-size: 1.7rem; }
    .podium-avatar.rank-2 { background: linear-gradient(135deg,#94a3b8,#64748b); }
    .podium-avatar.rank-3 { background: linear-gradient(135deg,#b45309,#92400e); }
    .podium-name  { font-weight: 800; font-size: .9rem; text-align: center; margin-bottom: 3px; }
    .podium-score {
      font-size: .82rem; font-weight: 700; color: #fff;
      padding: 3px 10px; border-radius: 20px; margin-bottom: 6px;
    }
    .podium-score.rank-1 { background: var(--gold); }
    .podium-score.rank-2 { background: var(--silver); }
    .podium-score.rank-3 { background: var(--bronze); }
    .podium-base {
      width: 100%; border-radius: 10px 10px 0 0; display: flex;
      align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 900;
      color: rgba(255,255,255,.9);
    }
    .podium-base.rank-1 { background: var(--gold); height: 90px; }
    .podium-base.rank-2 { background: var(--silver); height: 70px; }
    .podium-base.rank-3 { background: var(--bronze); height: 55px; }

    /* ── RANKING TABLE ───────────────────────────────────────────── */
    .ranking-card {
      background: var(--card-bg); border-radius: 14px;
      box-shadow: 0 2px 8px rgba(5,150,105,.08); overflow: hidden;
    }
    .ranking-card-header {
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      font-weight: 700; font-size: .9rem; color: var(--text-lt);
      display: grid;
      grid-template-columns: 44px 1fr 80px 70px 80px;
      gap: 8px;
    }
    .ranking-row {
      padding: 13px 20px; border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 44px 1fr 80px 70px 80px;
      gap: 8px;
      align-items: center;
      transition: background .15s;
    }
    .ranking-row:last-child { border-bottom: none; }
    .ranking-row:hover { background: var(--primary-pl); }
    .ranking-row.is-me { background: #fefce8; }
    .rank-badge {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: .9rem;
    }
    .rank-badge.r1 { background: #fef3c7; color: var(--gold); }
    .rank-badge.r2 { background: #f1f5f9; color: var(--silver); }
    .rank-badge.r3 { background: #fef3c7; color: var(--bronze); }
    .rank-badge.rn { background: var(--primary-lt); color: var(--primary); }
    .r-name   { font-weight: 700; font-size: .92rem; }
    .r-sub    { font-size: .75rem; color: var(--text-lt); margin-top: 2px; }
    .r-score  { font-weight: 800; font-size: 1rem; text-align: right; }
    .r-score.tinggi { color: var(--success); }
    .r-score.rendah { color: var(--danger); }
    .r-waktu  { font-size: .8rem; color: var(--text-lt); text-align: right; }
    .r-mapel  { font-size: .75rem; color: var(--text-lt); text-align: right; }
    .me-badge {
      display: inline-block; background: var(--primary); color: #fff;
      font-size: .65rem; font-weight: 800; padding: 1px 7px; border-radius: 20px;
      margin-left: 6px; vertical-align: middle;
    }

    /* ── MOBILE ──────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .ranking-card-header { display: none; }
      .ranking-row {
        grid-template-columns: 40px 1fr auto;
        grid-template-rows: auto auto;
      }
      .r-waktu, .r-mapel { display: none; }
      .rank-badge { width: 28px; height: 28px; font-size: .82rem; }
      .podium-base.rank-1 { height: 70px; }
      .podium-base.rank-2 { height: 56px; }
      .podium-base.rank-3 { height: 44px; }
    }
  </style>
</head>
<body>
  <script src="/belajar-mandiri/assets/js/auth-guard.js"></script>

  <div class="header">
    <div class="header-left">
      <span class="header-title">🏆 Papan Peringkat</span>
      <span class="header-sub">Belajar Mandiri</span>
    </div>
    <a href="/belajar-mandiri/home.html" class="btn-back">← Beranda</a>
  </div>

  <div class="main">
    <h1 class="page-title">Papan Peringkat</h1>
    <p class="page-sub" id="sub-title">Memuat data…</p>

    <div class="filter-bar">
      <span class="filter-label">Filter kuis:</span>
      <select class="filter-select" id="filter-kuis">
        <option value="global">🌍 Semua Kuis (Rata-rata)</option>
        <optgroup label="B. Indonesia">
          <option value="kuis_bi_bab5">Bab 5 — Hemat Pangkal Kaya</option>
          <option value="kuis_bi_bab6">Bab 6 — Tulus dalam Berkarya</option>
          <option value="kuis_bi_bab7">Bab 7 — Indonesia, Kaya Budaya</option>
          <option value="kuis_bi_bab8">Bab 8 — Aku Anak Sehat</option>
        </optgroup>
        <optgroup label="IPAS">
          <option value="kuis_ipas_bab1">Bab 1 — Daerahku Dulu dan Sekarang</option>
          <option value="kuis_ipas_bab2">Bab 2 — Indonesiaku Kaya Budaya</option>
          <option value="kuis_ipas_bab3">Bab 3 — Kebutuhan Hidup</option>
          <option value="kuis_ipas_bab4">Bab 4 — Masyarakat yang Beradab</option>
        </optgroup>
        <optgroup label="Pendidikan Pancasila">
          <option value="kuis_pp_bab1">Bab 1 — Keberagaman Budaya</option>
        </optgroup>
      </select>
      <button class="btn-refresh" id="btn-refresh" onclick="loadRanking()">↺ Perbarui</button>
    </div>

    <!-- Stat cards -->
    <div class="stat-row" id="stat-row" style="display:none">
      <div class="stat-card">
        <div class="stat-num" id="stat-peserta">–</div>
        <div class="stat-lbl">Peserta Aktif</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-rata">–</div>
        <div class="stat-lbl">Rata-rata Nilai</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-tuntas">–</div>
        <div class="stat-lbl">Tuntas (≥70)</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-tertinggi">–</div>
        <div class="stat-lbl">Nilai Tertinggi</div>
      </div>
    </div>

    <!-- Podium -->
    <div id="podium-wrap" style="display:none"></div>

    <!-- Loading -->
    <div class="loading-box" id="loading-box">
      <div class="loading-spinner"></div>
      <p>Sedang memuat data peringkat…</p>
    </div>

    <!-- Empty -->
    <div class="empty-box" id="empty-box" style="display:none">
      <div style="font-size:2.5rem;margin-bottom:12px">📭</div>
      <p style="font-weight:700;margin-bottom:6px">Belum ada hasil kuis</p>
      <p style="font-size:.85rem">Jadilah yang pertama mengerjakan kuis ini!</p>
    </div>

    <!-- Ranking table -->
    <div class="ranking-card" id="ranking-card" style="display:none">
      <div class="ranking-card-header">
        <span>#</span>
        <span>Nama Siswa</span>
        <span style="text-align:right">Nilai</span>
        <span style="text-align:right">Waktu</span>
        <span style="text-align:right">Kuis</span>
      </div>
      <div id="ranking-list"></div>
    </div>
  </div>

<script type="module">
const pathParts = window.location.pathname.split('/');
const repoIndex = pathParts.indexOf('belajar-mandiri');
const basePath  = repoIndex >= 0
  ? pathParts.slice(0, repoIndex + 1).join('/') + '/'
  : '/belajar-mandiri/';

const FIREBASE_JS = basePath + 'assets/js/firebase.js';

// Impor dinamis
const { getRankingKuis, getSemuaHasilKuis, getProfilUser, onAuthChange } =
  await import(FIREBASE_JS);

let currentUid = null;

onAuthChange(async (user) => {
  if (!user) return;
  currentUid = user.uid;
  loadRanking();
});

window.loadRanking = async function () {
  const kuisId = document.getElementById('filter-kuis').value;
  document.getElementById('btn-refresh').disabled = true;
  document.getElementById('btn-refresh').textContent = '…';

  // Reset UI
  document.getElementById('loading-box').style.display   = 'block';
  document.getElementById('empty-box').style.display     = 'none';
  document.getElementById('ranking-card').style.display  = 'none';
  document.getElementById('podium-wrap').style.display   = 'none';
  document.getElementById('stat-row').style.display      = 'none';

  try {
    let rows = [];

    if (kuisId === 'global') {
      // Mode global: ambil semua hasil, agregasi per user (nilai terbaik per kuis)
      document.getElementById('sub-title').textContent =
        'Rata-rata nilai terbaik dari semua kuis yang pernah dikerjakan';
      const semua = await getSemuaHasilKuis(500);
      rows = _agregasiGlobal(semua);
    } else {
      document.getElementById('sub-title').textContent =
        'Semua percobaan terbaik per siswa untuk kuis ini';
      const raw = await getRankingKuis(kuisId, 50);
      rows = _perBestPerUser(raw);
    }

    if (!rows.length) {
      document.getElementById('empty-box').style.display = 'block';
    } else {
      _renderStats(rows);
      _renderPodium(rows.slice(0, 3));
      _renderTable(rows);
      document.getElementById('stat-row').style.display   = 'grid';
      document.getElementById('podium-wrap').style.display = 'flex';
      document.getElementById('ranking-card').style.display = 'block';
    }
  } catch(err) {
    document.getElementById('empty-box').innerHTML =
      `<div style="font-size:2rem;margin-bottom:12px">⚠️</div>
       <p style="font-weight:700;color:#dc2626;margin-bottom:6px">Gagal memuat data</p>
       <p style="font-size:.85rem">${err.message}</p>
       <p style="font-size:.78rem;margin-top:8px;color:#64748b">
         Pastikan index Firestore sudah dibuat dan rules sudah di-publish.</p>`;
    document.getElementById('empty-box').style.display = 'block';
  } finally {
    document.getElementById('loading-box').style.display = 'none';
    document.getElementById('btn-refresh').disabled = false;
    document.getElementById('btn-refresh').textContent = '↺ Perbarui';
  }
};

// Ambil nilai terbaik per user untuk satu kuis
function _perBestPerUser(rows) {
  const map = {};
  rows.forEach(r => {
    if (!map[r.uid] || r.nilai > map[r.uid].nilai ||
        (r.nilai === map[r.uid].nilai && r.waktuDetik < map[r.uid].waktuDetik)) {
      map[r.uid] = r;
    }
  });
  return Object.values(map)
    .sort((a, b) => b.nilai - a.nilai || a.waktuDetik - b.waktuDetik);
}

// Rata-rata nilai terbaik per user lintas semua kuis
function _agregasiGlobal(rows) {
  // Untuk setiap user, ambil nilai terbaik per kuisId, lalu rata-rata
  const userKuis = {};
  rows.forEach(r => {
    if (!userKuis[r.uid]) userKuis[r.uid] = { uid: r.uid, nama: r.nama, kelas: r.kelas, perKuis: {} };
    const pk = userKuis[r.uid].perKuis;
    if (!pk[r.kuisId] || r.nilai > pk[r.kuisId]) pk[r.kuisId] = r.nilai;
  });
  return Object.values(userKuis).map(u => {
    const vals  = Object.values(u.perKuis);
    const rata  = vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : 0;
    return {
      uid: u.uid, nama: u.nama, kelas: u.kelas,
      nilai: rata,
      jumlahKuis: vals.length,
      waktuDetik: 0,
      kuisId: 'global', mapel: `${vals.length} kuis`,
      bab: `Rata-rata ${vals.length} kuis`
    };
  }).sort((a, b) => b.nilai - a.nilai || b.jumlahKuis - a.jumlahKuis);
}

function _renderStats(rows) {
  const total   = rows.length;
  const rata    = total ? Math.round(rows.reduce((s, r) => s + r.nilai, 0) / total) : 0;
  const tuntas  = rows.filter(r => r.nilai >= 70).length;
  const max     = rows.length ? rows[0].nilai : 0;
  document.getElementById('stat-peserta').textContent   = total;
  document.getElementById('stat-rata').textContent      = rata;
  document.getElementById('stat-tuntas').textContent    = tuntas;
  document.getElementById('stat-tertinggi').textContent = max;
}

function _renderPodium(top) {
  const order = [1, 0, 2]; // posisi: 2nd, 1st, 3rd
  const wrap  = document.getElementById('podium-wrap');
  wrap.className = 'podium';
  wrap.innerHTML = '';
  order.forEach(oi => {
    if (!top[oi]) return;
    const r    = top[oi];
    const rank = oi + 1;
    const div  = document.createElement('div');
    div.className = 'podium-item';
    const initial = (r.nama || '?')[0].toUpperCase();
    div.innerHTML = `
      <div class="podium-avatar rank-${rank}">${initial}</div>
      <div class="podium-name">${_esc(r.nama)}</div>
      <div class="podium-score rank-${rank}">${r.nilai}</div>
      <div class="podium-base rank-${rank}">${rank === 1 ? '🥇' : rank === 2 ? '🥈' : '🥉'}</div>`;
    wrap.appendChild(div);
  });
}

function _renderTable(rows) {
  const list = document.getElementById('ranking-list');
  list.innerHTML = '';
  rows.forEach((r, i) => {
    const rank  = i + 1;
    const isMe  = r.uid === currentUid;
    const cls   = ['r1','r2','r3'][i] || 'rn';
    const emoji = ['🥇','🥈','🥉'][i] || rank;
    const waktu = _formatWaktu(r.waktuDetik);
    const rCls  = r.nilai >= 70 ? 'tinggi' : 'rendah';
    const meBadge = isMe ? '<span class="me-badge">Kamu</span>' : '';

    const mapelLabel = r.kuisId === 'global'
      ? r.mapel
      : (r.mapel || r.kuisId);

    const row = document.createElement('div');
    row.className = `ranking-row${isMe ? ' is-me' : ''}`;
    row.innerHTML = `
      <div class="rank-badge ${cls}">${emoji}</div>
      <div>
        <div class="r-name">${_esc(r.nama)}${meBadge}</div>
        <div class="r-sub">${_esc(r.kelas || '')} ${r.bab ? '· ' + _esc(r.bab) : ''}</div>
      </div>
      <div class="r-score ${rCls}">${r.nilai}</div>
      <div class="r-waktu">${waktu}</div>
      <div class="r-mapel">${_esc(mapelLabel)}</div>`;
    list.appendChild(row);
  });
}

function _formatWaktu(detik) {
  if (!detik) return '–';
  const m = Math.floor(detik / 60);
  const s = detik % 60;
  return m > 0 ? `${m}m ${s}d` : `${s}d`;
}

function _esc(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Load ranking saat filter berubah
document.getElementById('filter-kuis').addEventListener('change', () => {
  if (currentUid) loadRanking();
});
</script>
</body>
</html>
