<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Papan Peringkat · Belajar Mandiri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --primary:#059669;--primary-lt:#d1fae5;--primary-pl:#f0fdf4;
      --bi:#0369a1;--bi-lt:#e0f2fe;
      --ipas:#047857;--ipas-lt:#d1fae5;
      --pp:#7c3aed;--pp-lt:#ede9fe;
      --gold:#d97706;--silver:#64748b;--bronze:#92400e;
      --ok:#16a34a;--danger:#dc2626;
      --text:#1e293b;--text-lt:#64748b;--border:#e2e8f0;
      --bg:#f0fdf4;--card:#ffffff;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

    /* HEADER */
    .header{background:var(--primary);color:#fff;padding:0 20px;height:60px;
      display:flex;align-items:center;justify-content:space-between;
      box-shadow:0 2px 10px rgba(0,0,0,.18);position:sticky;top:0;z-index:50}
    .header-title{font-family:'Lora',serif;font-size:1.05rem;font-weight:700;font-style:italic}
    .header-sub{font-size:.72rem;opacity:.8;margin-top:1px}
    .btn-nav{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
      color:#fff;border-radius:8px;padding:6px 14px;font-family:'Nunito',sans-serif;
      font-size:.82rem;font-weight:700;cursor:pointer;text-decoration:none;
      display:inline-flex;align-items:center;gap:6px;transition:background .2s}
    .btn-nav:hover{background:rgba(255,255,255,.25)}
    .header-nav{display:flex;gap:8px}

    /* MAIN */
    .main{max-width:900px;margin:0 auto;padding:24px 16px 60px}

    /* MAPEL TABS */
    .mapel-tabs{display:flex;gap:0;background:var(--card);border-radius:14px;
      padding:6px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);flex-wrap:wrap;gap:4px}
    .mapel-tab{flex:1;min-width:100px;padding:10px 8px;border-radius:10px;border:none;
      font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;
      background:transparent;color:var(--text-lt);transition:all .18s;text-align:center}
    .mapel-tab:hover{background:#f1f5f9;color:var(--text)}
    .mapel-tab.aktif[data-m="global"]{background:var(--primary);color:#fff}
    .mapel-tab.aktif[data-m="bi"]   {background:var(--bi);color:#fff}
    .mapel-tab.aktif[data-m="ipas"] {background:var(--ipas);color:#fff}
    .mapel-tab.aktif[data-m="pp"]   {background:var(--pp);color:#fff}

    /* BAB SUB-FILTER */
    .bab-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
    .bab-chip{padding:6px 14px;border-radius:50px;font-size:.8rem;font-weight:700;
      cursor:pointer;border:1.5px solid var(--border);background:var(--card);color:var(--text-lt);transition:all .18s}
    .bab-chip.aktif,.bab-chip:hover{border-color:currentColor}
    .bab-chip.aktif-bi,.bab-chip.hover-bi:hover{background:var(--bi-lt);color:var(--bi);border-color:var(--bi)}
    .bab-chip.aktif-ipas{background:var(--ipas-lt);color:var(--ipas);border-color:var(--ipas)}
    .bab-chip.aktif-pp{background:var(--pp-lt);color:var(--pp);border-color:var(--pp)}
    .bab-chip.aktif-global{background:var(--primary-lt);color:var(--primary);border-color:var(--primary)}

    /* STATS */
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
      gap:12px;margin-bottom:22px}
    .stat-card{background:var(--card);border-radius:12px;padding:14px 16px;
      border-top:3px solid var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.05)}
    .stat-num{font-size:1.6rem;font-weight:800;color:var(--primary)}
    .stat-lbl{font-size:.75rem;color:var(--text-lt);margin-top:2px}

    /* PODIUM */
    .podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;
      margin-bottom:24px;padding:0 4px}
    .podium-item{display:flex;flex-direction:column;align-items:center;flex:1;max-width:180px}
    .podium-avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;
      font-size:1.3rem;font-weight:800;color:#fff;margin-bottom:7px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
    .p-av-1{width:60px;height:60px;background:linear-gradient(135deg,#f59e0b,#d97706);font-size:1.6rem}
    .p-av-2{width:50px;height:50px;background:linear-gradient(135deg,#94a3b8,#64748b)}
    .p-av-3{width:46px;height:46px;background:linear-gradient(135deg,#b45309,#92400e)}
    .podium-name{font-weight:800;font-size:.85rem;text-align:center;margin-bottom:3px}
    .podium-score{font-size:.78rem;font-weight:700;color:#fff;padding:2px 10px;border-radius:20px;margin-bottom:5px}
    .ps-1{background:var(--gold)}.ps-2{background:var(--silver)}.ps-3{background:var(--bronze)}
    .podium-base{width:100%;border-radius:10px 10px 0 0;display:flex;align-items:center;
      justify-content:center;font-size:1.3rem;font-weight:900;color:rgba(255,255,255,.9)}
    .pb-1{background:var(--gold);height:80px}.pb-2{background:var(--silver);height:62px}
    .pb-3{background:var(--bronze);height:48px}

    /* RANKING TABLE */
    .rank-card{background:var(--card);border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden}
    .rank-head{padding:12px 20px;border-bottom:1px solid var(--border);font-weight:700;
      font-size:.82rem;color:var(--text-lt);display:grid;
      grid-template-columns:44px 1fr 75px 70px;gap:8px}
    .rank-row{padding:12px 20px;border-bottom:1px solid var(--border);display:grid;
      grid-template-columns:44px 1fr 75px 70px;gap:8px;align-items:center;transition:background .15s}
    .rank-row:last-child{border-bottom:none}
    .rank-row:hover{background:var(--primary-pl)}
    .rank-row.is-me{background:#fefce8}
    .rank-badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.88rem}
    .rb-1{background:#fef3c7;color:var(--gold)}.rb-2{background:#f1f5f9;color:var(--silver)}
    .rb-3{background:#fef3c7;color:var(--bronze)}.rb-n{background:var(--primary-lt);color:var(--primary)}
    .r-name{font-weight:700;font-size:.9rem}
    .r-sub{font-size:.73rem;color:var(--text-lt);margin-top:1px}
    .me-badge{background:var(--primary);color:#fff;font-size:.62rem;font-weight:800;
      padding:1px 6px;border-radius:20px;margin-left:5px;vertical-align:middle}
    .r-score{font-weight:800;text-align:right}
    .r-score.ok{color:var(--ok)}.r-score.danger{color:var(--danger)}
    .r-info{font-size:.75rem;color:var(--text-lt);text-align:right}

    /* LOADING/EMPTY */
    .state-box{padding:40px;text-align:center;color:var(--text-lt)}
    .spinner{width:32px;height:32px;border:4px solid var(--primary-lt);border-top-color:var(--primary);
      border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty-icon{font-size:2rem;margin-bottom:10px}

    @media(max-width:580px){
      .rank-head{display:none}.rank-row{grid-template-columns:40px 1fr auto}
      .r-info{display:none}
      .pb-1{height:60px}.pb-2{height:48px}.pb-3{height:38px}
    }
  </style>
</head>
<body>
<script src="/belajar-mandiri/assets/js/auth-guard.js"></script>

<div class="header">
  <div>
    <div class="header-title">🏆 Papan Peringkat</div>
    <div class="header-sub">Belajar Mandiri · Kelas 4</div>
  </div>
  <div class="header-nav">
    <a href="/belajar-mandiri/dashboard.html" class="btn-nav">📊 Dashboard</a>
    <a href="/belajar-mandiri/home.html"      class="btn-nav">🏠 Beranda</a>
  </div>
</div>

<div class="main">

  <!-- Mapel tabs -->
  <div class="mapel-tabs">
    <button class="mapel-tab aktif" data-m="global">🌍 Semua</button>
    <button class="mapel-tab" data-m="bi">📖 B. Indonesia</button>
    <button class="mapel-tab" data-m="ipas">🔬 IPAS</button>
    <button class="mapel-tab" data-m="pp">🇮🇩 Pend. Pancasila</button>
  </div>

  <!-- Bab sub-filter (hidden for global) -->
  <div class="bab-filter" id="bab-filter"></div>

  <!-- Stats -->
  <div class="stats-grid" id="stats-grid" style="display:none">
    <div class="stat-card">
      <div class="stat-num" id="s-peserta">—</div>
      <div class="stat-lbl">Peserta</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="s-rata">—</div>
      <div class="stat-lbl">Rata-rata Nilai</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="s-tuntas">—</div>
      <div class="stat-lbl">Tuntas ≥70</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="s-max">—</div>
      <div class="stat-lbl">Nilai Tertinggi</div>
    </div>
  </div>

  <!-- Podium -->
  <div id="podium-wrap" style="display:none"></div>

  <!-- Loading -->
  <div class="rank-card" id="loading-card">
    <div class="state-box"><div class="spinner"></div><p>Memuat data peringkat…</p></div>
  </div>

  <!-- Ranking table -->
  <div class="rank-card" id="rank-card" style="display:none">
    <div class="rank-head">
      <span>#</span><span>Nama Siswa</span>
      <span style="text-align:right">Nilai</span>
      <span style="text-align:right">Info</span>
    </div>
    <div id="rank-list"></div>
  </div>

</div>

<script type="module">
const pathParts = window.location.pathname.split('/');
const repoIdx   = pathParts.indexOf('belajar-mandiri');
const base      = repoIdx >= 0 ? pathParts.slice(0, repoIdx+1).join('/')+'/':'/belajar-mandiri/';
const FB        = base + 'assets/js/firebase.js';
const { onAuthChange, getRankingKuis, getSemuaHasilKuis } = await import(FB);

/* ── METADATA ─────────────────────────────────────────────────── */
const BAB_LIST = {
  global: [],
  bi:   [
    {id:'kuis_bi_bab5', label:'Bab 5 — Hemat Pangkal Kaya'},
    {id:'kuis_bi_bab6', label:'Bab 6 — Tulus dalam Berkarya'},
    {id:'kuis_bi_bab7', label:'Bab 7 — Indonesia, Kaya Budaya'},
    {id:'kuis_bi_bab8', label:'Bab 8 — Aku Anak Sehat'},
  ],
  ipas: [
    {id:'kuis_ipas_bab1', label:'Bab 1 — Daerahku Dulu dan Sekarang'},
    {id:'kuis_ipas_bab2', label:'Bab 2 — Indonesiaku Kaya Budaya'},
    {id:'kuis_ipas_bab3', label:'Bab 3 — Kebutuhan Hidup'},
    {id:'kuis_ipas_bab4', label:'Bab 4 — Masyarakat yang Beradab'},
  ],
  pp: [
    {id:'kuis_pp_bab1', label:'Bab 1 — Jati Diri dalam Kebinekaan'},
    {id:'kuis_pp_bab2', label:'Bab 2 — Negaraku Indonesia'},
    {id:'kuis_pp_bab3', label:'Bab 3 — Pola Hidup Gotong Royong'},
  ],
};
const MAPEL_COLOR = {global:'global',bi:'bi',ipas:'ipas',pp:'pp'};

/* ── STATE ────────────────────────────────────────────────────── */
let activeM   = 'global';
let activeKuis = 'global';  // 'global' | kuisId
let currentUid = null;

/* ── AUTH ─────────────────────────────────────────────────────── */
onAuthChange(async user => {
  if (!user) return;
  currentUid = user.uid;
  await load();
});

/* ── UI: BAB FILTER ───────────────────────────────────────────── */
function renderBabFilter(m) {
  const wrap = document.getElementById('bab-filter');
  if (m === 'global') { wrap.innerHTML = ''; return; }

  const babs  = BAB_LIST[m] || [];
  const color = MAPEL_COLOR[m];

  wrap.innerHTML = `
    <button class="bab-chip aktif-${color}" data-kid="semua-${m}">Semua Bab</button>
    ${babs.map(b => `<button class="bab-chip" data-kid="${b.id}">${b.label.replace(/^Bab \d+ — /, 'Bab ')}</button>`).join('')}
  `;

  wrap.querySelectorAll('.bab-chip').forEach(btn => {
    btn.addEventListener('click', async () => {
      wrap.querySelectorAll('.bab-chip').forEach(b => {
        b.className = 'bab-chip';
      });
      btn.classList.add('aktif-' + color);
      activeKuis = btn.dataset.kid;
      await load();
    });
  });
}

/* ── LOAD DATA ────────────────────────────────────────────────── */
async function load() {
  document.getElementById('loading-card').style.display = 'block';
  document.getElementById('rank-card').style.display    = 'none';
  document.getElementById('stats-grid').style.display   = 'none';
  document.getElementById('podium-wrap').style.display  = 'none';

  try {
    let rows = [];

    if (activeM === 'global') {
      const semua = await getSemuaHasilKuis(500);
      rows = agregasiGlobal(semua);
    } else if (activeKuis === `semua-${activeM}` || activeKuis === 'global') {
      // Rata-rata semua bab dalam mapel
      const semua = await getSemuaHasilKuis(500);
      const ids   = (BAB_LIST[activeM] || []).map(b => b.id);
      const fil   = semua.filter(r => ids.includes(r.kuisId));
      rows = agregasiGlobal(fil);
    } else {
      // Satu bab spesifik
      const raw = await getRankingKuis(activeKuis, 100);
      rows = bestPerUser(raw);
    }

    renderStats(rows);
    renderPodium(rows.slice(0,3));
    renderTable(rows);
    document.getElementById('stats-grid').style.display = 'grid';
    document.getElementById('podium-wrap').style.display = rows.length >= 1 ? 'flex' : 'none';
    document.getElementById('rank-card').style.display  = 'block';
  } catch(e) {
    document.getElementById('rank-list').innerHTML =
      `<div class="state-box">
        <div class="empty-icon">⚠️</div>
        <p style="color:#dc2626;font-weight:700">Gagal memuat data</p>
        <p style="font-size:.83rem;margin-top:6px">${e.message}</p>
        <p style="font-size:.76rem;margin-top:8px;color:var(--text-lt)">
          Pastikan Firestore Index sudah dibuat. Lihat ANTI-REGRESI.md.</p>
      </div>`;
    document.getElementById('rank-card').style.display = 'block';
  } finally {
    document.getElementById('loading-card').style.display = 'none';
  }
}

/* ── DATA HELPERS ─────────────────────────────────────────────── */
function bestPerUser(rows) {
  const map = {};
  rows.forEach(r => {
    const key = r.uid;
    if (!map[key] || r.nilai > map[key].nilai ||
        (r.nilai === map[key].nilai && r.waktuDetik < map[key].waktuDetik))
      map[key] = r;
  });
  return Object.values(map).sort((a,b) => b.nilai-a.nilai || a.waktuDetik-b.waktuDetik);
}

function agregasiGlobal(rows) {
  const ukuis = {};
  rows.forEach(r => {
    if (!ukuis[r.uid]) ukuis[r.uid] = { uid:r.uid, nama:r.nama, kelas:r.kelas, perKuis:{} };
    const pk = ukuis[r.uid].perKuis;
    if (!pk[r.kuisId] || r.nilai > pk[r.kuisId]) pk[r.kuisId] = r.nilai;
  });
  return Object.values(ukuis).map(u => {
    const vals = Object.values(u.perKuis);
    const rata = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : 0;
    return { uid:u.uid, nama:u.nama, kelas:u.kelas, nilai:rata,
             jumlahKuis:vals.length, waktuDetik:0, label:`${vals.length} kuis` };
  }).sort((a,b) => b.nilai-a.nilai || b.jumlahKuis-a.jumlahKuis);
}

/* ── RENDER ───────────────────────────────────────────────────── */
function renderStats(rows) {
  const n   = rows.length;
  const rata = n ? Math.round(rows.reduce((s,r)=>s+r.nilai,0)/n) : 0;
  document.getElementById('s-peserta').textContent = n;
  document.getElementById('s-rata').textContent    = rata || '—';
  document.getElementById('s-tuntas').textContent  = rows.filter(r=>r.nilai>=70).length;
  document.getElementById('s-max').textContent     = n ? rows[0].nilai : '—';
}

function renderPodium(top) {
  const wrap = document.getElementById('podium-wrap');
  wrap.style.cssText = 'display:flex;justify-content:center;align-items:flex-end;gap:10px;margin-bottom:20px;padding:0 4px';
  const order = [1,0,2]; // 2nd, 1st, 3rd
  wrap.innerHTML = '';
  order.forEach(oi => {
    if (!top[oi]) return;
    const r = top[oi], rank = oi+1;
    const avCls  = `podium-avatar p-av-${rank}`;
    const scCls  = `podium-score ps-${rank}`;
    const bsCls  = `podium-base pb-${rank}`;
    const emoji  = ['🥇','🥈','🥉'][oi];
    const init   = (r.nama||'?')[0].toUpperCase();
    const el = document.createElement('div');
    el.className = 'podium-item';
    el.innerHTML = `
      <div class="${avCls}">${init}</div>
      <div class="podium-name">${esc(r.nama)}</div>
      <div class="${scCls}">${r.nilai}</div>
      <div class="${bsCls}">${emoji}</div>`;
    wrap.appendChild(el);
  });
}

function renderTable(rows) {
  const list = document.getElementById('rank-list');
  if (!rows.length) {
    list.innerHTML = `<div class="state-box">
      <div class="empty-icon">📭</div>
      <p style="font-weight:700">Belum ada data</p>
      <p style="font-size:.83rem;margin-top:6px">Jadilah yang pertama mengerjakan kuis ini!</p></div>`;
    return;
  }
  const MEDALS = ['🥇','🥈','🥉'];
  list.innerHTML = rows.map((r,i) => {
    const rank = i+1, isMe = r.uid === currentUid;
    const rbCls = ['rb-1','rb-2','rb-3'][i] || 'rb-n';
    const badge = MEDALS[i] || rank;
    const sCls  = r.nilai >= 70 ? 'ok' : 'danger';
    const info  = r.label || (r.waktuDetik ? fmtWaktu(r.waktuDetik) : '—');
    return `<div class="rank-row${isMe?' is-me':''}">
      <div class="rank-badge ${rbCls}">${badge}</div>
      <div>
        <div class="r-name">${esc(r.nama||'—')}${isMe?'<span class="me-badge">Kamu</span>':''}</div>
        <div class="r-sub">${esc(r.kelas||'')}${r.jumlahKuis?' · '+r.jumlahKuis+' kuis':''}</div>
      </div>
      <div class="r-score ${sCls}">${r.nilai}</div>
      <div class="r-info">${esc(info)}</div>
    </div>`;
  }).join('');
}

function fmtWaktu(s){ if(!s)return'—';const m=Math.floor(s/60),ss=s%60;return m?`${m}m ${ss}d`:`${ss}d`}
function esc(str){ if(!str)return''; return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

/* ── TAB EVENTS ───────────────────────────────────────────────── */
document.querySelectorAll('.mapel-tab').forEach(btn => {
  btn.addEventListener('click', async () => {
    document.querySelectorAll('.mapel-tab').forEach(t=>t.classList.remove('aktif'));
    btn.classList.add('aktif');
    activeM    = btn.dataset.m;
    activeKuis = activeM === 'global' ? 'global' : `semua-${activeM}`;
    renderBabFilter(activeM);
    if (currentUid) await load();
  });
});
</script>
</body>
</html>
